function reviewHtml(w,s,mode,reveal){
  const ctx={w,s,mode,reveal:mode!=='student'||!!reveal};let n=1;
  return w.questions.map(q=>{const h=qRev(q,n,ctx);n+=units(q);return h}).join('');
}
function numLabel(q,n){const u=units(q);return q.type==='writing'?(q.task==='task1'?'T1':q.task==='task2'?'T2':'W'):q.type==='speaking'?(q.part?'P'+q.part:'S'):u>1?`${n}–${n+u-1}`:String(n)}
function qRev(q,n,ctx){
  const {s,mode,reveal}=ctx,a=s?s.answers[q.id]:undefined,r=s&&s.auto?s.auto[q.id]:null,M=s&&s.manual?s.manual[q.id]:null;
  if(q.type==='section')return `<div class="secrev">${secHead(q.text,'h3')}${q.image?`<img class="wp-img" src="${esc(furl(q.image))}" alt="">`:''}${secAudio(q)?`<audio controls preload="none" src="${esc(furl(secAudio(q)))}" style="margin-top:10px"></audio>`:''}${q.passage?`<details style="margin-top:8px"><summary class="lbl" style="cursor:pointer">Matnni ko‘rsatish</summary><div class="passage" style="padding:10px 0;max-width:none">${paras(q.passage)}</div></details>`:''}</div>`;
  const tagCls=r?(r.ok?'ok':r.s>0?'part':'no'):'';
  let right='';
  if(r&&mode==='teacher')right=`<label class="ov" title="Avtomatik ballni qo‘lda o‘zgartirish">Ball <input type="number" min="0" max="${q.pts}" step="0.5" data-g="${q.id}.override" value="${M&&M.override!=null?M.override:''}" placeholder="${fNum(r.s)}"> / ${q.pts}</label>`;
  else if(r)right=`<span class="qs ${tagCls}">${fNum(r.s)}/${q.pts}</span>`;
  else if(mode==='key'&&q.pts!=null&&!(ctx.w.kind==='ielts'&&(q.type==='writing'||q.type==='speaking')))right=`<span class="qs">${q.pts} ball</span>`;
  const head=t=>`<div class="rqh"><span class="qn">${numLabel(q,n)}</span><div class="rqt">${t}</div>${right}</div>`;
  let body='';
  switch(q.type){
  case 'mcq':{const sel=Array.isArray(a)?a:[];body=`<ul class="ropts">${q.options.map((o,j)=>{const me=sel.includes(j),cor=reveal&&q.answer&&q.answer.includes(j);return `<li class="${me?'me':''} ${cor?'cor':''} ${me&&reveal&&q.answer&&!cor?'wrong':''}"><span class="lt">${LET(j)}</span><span>${esc(o)}</span>${cor?'<em>To‘g‘ri javob</em>':me&&mode!=='key'?'<em style="color:var(--acc)">Tanlangan</em>':''}</li>`}).join('')}</ul>`;break}
  case 'tfng':{const L=TFL(q.variant);body=`<div class="row wrap">${s?`<span class="gv ${r?(r.ok?'ok':'no'):''}">${a?L[a]:'Javob berilmagan'}</span>`:''}${reveal&&q.answer&&(!r||!r.ok)?`<span class="cor">To‘g‘ri javob: <span class="notr">${L[q.answer]}</span></span>`:''}</div>`;break}
  case 'gap':{const g=gapParse(q.text),ps=q.parts||g.parts,alts=q.parts?null:g.ans,gv=Array.isArray(a)?a:[];let h='';
    ps.forEach((t,k)=>{h+=nl(t);if(k<ps.length-1){if(!s){h+=`<span class="gv key">${esc((alts&&alts[k]||[]).join(' / '))}</span>`;return}const ok=r&&r.marks?r.marks[k]:null;h+=`<span class="gv ${ok===true?'ok':ok===false?'no':''}">${gv[k]?esc(gv[k]):'—'}</span>`;if(reveal&&alts&&ok!==true)h+=`<span class="gc">${esc(alts[k].join(' / '))}</span>`}});
    return `<div class="rq">${head(`<span class="mute sm">${QT.gap}</span>`)}<div class="rb"><div class="gtext">${h}</div></div></div>`}
  case 'short':body=`<div class="row wrap">${s?`<span class="gv ${r?(r.ok?'ok':'no'):''}">${a?esc(a):'Javob berilmagan'}</span>`:''}${reveal&&q.answers?`<span class="cor">Qabul qilinadi: <span class="notr">${esc(q.answers.join(' / '))}</span></span>`:''}</div>`;break;
  case 'match':body=`<div class="twrap"><table class="mtbl"><tbody>${q.left.map((l,k)=>{const gi=Array.isArray(a)?a[k]:null,ok=r&&r.marks?r.marks[k]:null,ci=q.answer?q.answer[k]:null;const mine=gi!=null&&q.right[gi]!=null?`${LET(gi)}. ${esc(q.right[gi])}`:'—';return `<tr><td><b class="mono">${n+k}</b> ${esc(l)}</td><td>${s?`<span class="gv ${ok===true?'ok':ok===false?'no':''}">${mine}</span>`:''}${reveal&&ci!=null&&ok!==true?` <span class="cor">${LET(ci)}. ${esc(q.right[ci])}</span>`:''}</td></tr>`}).join('')}</tbody></table></div>`;break;
  case 'order':body=`${s?`<div class="seq ${r&&r.ok?'ok':'no'}">${(Array.isArray(a)?a:[]).map(x=>`<span>${esc(x)}</span>`).join('')||'—'}</div>`:''}${reveal&&q.items&&(!r||!r.ok)?`<div class="seq key">${q.items.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:''}`;break;
  case 'writing':body=`${q.image?`<img class="wp-img" src="${esc(furl(q.image))}" alt="Topshiriq grafigi">`:''}${q.minWords&&!s?`<span class="mute sm">Kamida ${q.minWords} so‘z</span>`:''}${s?`<div class="essay">${a?esc(a):'<span class="mute">Javob yozilmagan</span>'}</div><div class="wc"><span>${words(a)} so‘z${q.minWords?` · kamida ${q.minWords}`:''}</span></div>`:''}${s?manBlock(q,ctx):''}`;break;
  case 'html':{const F=(a&&a.fields)||{},MK=(r&&r.marks)||{},fl=q.fields||[];
    const disp=(f,v)=>{if(v==null||v===''||(Array.isArray(v)&&!v.length))return '—';if(f.kind==='radio')return esc(f.options[+v]!=null?LET(+v)+'. '+f.options[+v]:v);if(f.kind==='check')return (Array.isArray(v)?v:[]).map(k=>esc(f.options[k]!=null?LET(k)+'. '+f.options[k]:k)).join(', ');return esc(v)};
    const corr=f=>{const A=f.answers||[];if(!A.length)return '';if(f.kind==='radio')return disp(f,A[0]);if(f.kind==='check')return disp(f,A[0].split(',').map(Number));return esc(A.join(' / '))};
    const rows=fl.filter(f=>f.graded||(f.answers||[]).length).map(f=>{const ok=MK[f.key];return `<tr><td>${esc(f.label||f.key)}</td><td>${s?`<span class="gv ${ok===true?'ok':ok===false?'no':''}">${disp(f,F[f.key])}</span>`:''}${reveal&&(f.answers||[]).length&&ok!==true?` <span class="cor">${corr(f)}</span>`:''}</td></tr>`}).join('');
    body=`${rows?`<div class="twrap"><table class="mtbl"><tbody>${rows}</tbody></table></div>`:''}${q.selfScore?`<div class="row wrap"><span class="chip">HTML natijasi</span>${s?(a&&a.self?`<b class="num">${fNum(a.self.score)} / ${fNum(a.self.max)}</b>`:'<span class="mute">Natija yuborilmagan</span>'):`<span class="mute sm">${q.selfPts} ball</span>`}</div>`:''}${mode!=='student'&&q.html?`<details><summary class="lbl" style="cursor:pointer">HTML’ni ko‘rish${s?' — o‘quvchi javoblari bilan':''}</summary>${frameHtml(q,{readonly:!!s,restore:s?F:null})}</details>`:''}`;break}
  case 'speaking':body=`${s?(a&&a.fid?`<audio controls preload="metadata" src="${esc(furl(a))}"></audio>`:'<span class="mute">Ovoz yozilmagan</span>'):`<span class="mute sm">${q.prepSec?`Tayyorlanish ${q.prepSec} s · `:''}Javob ${q.maxSec} s</span>`}${s?manBlock(q,ctx):''}`;break;
  }
  return `<div class="rq">${head(q.type==='html'?(q.text?nl(q.text):`<span class="mute sm">${esc(q.html?q.html.name:'HTML topshiriq')}</span>`):q.type==='tfng'?`<span class="mute sm">Statement</span><br>${nl(q.text)}`:q.type==='writing'||q.type==='speaking'?`${q.task||q.part?`<span class="tag">${q.task?q.task.replace('task','Task '):'Part '+q.part}</span><br>`:''}${nl(q.text)}`:nl(q.text))}<div class="rb">${body}</div></div>`;
}
function manBlock(q,ctx){
  const {w,s,mode}=ctx,id=q.id,ielts=w.kind==='ielts'&&q.type!=='general';
  if(mode==='teacher'){const M=GR.manual[id]||{};
    const crit=ielts?CRIT[q.type].map((l,k)=>`<label class="crit"><span>${l}</span><select data-g="${id}.bands.${CK[k]}" aria-label="${esc(l)}">${opt('','—',M.bands&&M.bands[CK[k]])}${BANDS.map(b=>opt(b,b.toFixed(1),M.bands&&M.bands[CK[k]]!=null?Number(M.bands[CK[k]]):'')).join('')}</select></label>`).join('')+`<div class="crit"><b>Band (taxminiy)</b><span class="chip band" id="gb-${id}" style="justify-self:start">${critTxt(M.bands)}</span></div>`
     :`<label class="crit"><b>Ball (max ${q.pts})</b><input type="number" min="0" max="${q.pts}" step="0.5" data-g="${id}.score" value="${M.score??''}"></label>`;
    const ai=q.type==='writing'&&aiOn()?`<div class="row wrap"><button class="btn ghost sm" data-a="aiAssess" data-q="${id}" ${GR.ai[id]&&GR.ai[id].loading?'disabled':''}>${ic('spark')} ${GR.ai[id]&&GR.ai[id].loading?'AI baholamoqda…':'AI bahosi (qoralama)'}</button><span class="hint">Natijani tekshirib, kerak bo‘lsa o‘zgartirib saqlaysiz.</span></div>${aiBox(id)}`:'';
    return `<div class="mgrade">${ai}${crit}<label class="lbl" style="margin:4px 0 0">Izoh</label><textarea rows="3" data-g="${id}.fb" placeholder="Masalan: Linking words yaxshi, lekin articles’da xatolar bor.">${esc(M.fb||'')}</textarea></div>`}
  if(mode==='student'){const M=s.manual&&s.manual[id];if(!M)return '';
    const sc=ielts?(M.band!=null?`<span class="chip band">Band ${fBand(M.band)}</span>`:''):(M.score!=null?`<span class="chip ok">${fNum(M.score)}/${q.pts}</span>`:'');
    const cr=ielts&&M.bands?`<div class="twrap"><table class="mtbl"><tbody>${CRIT[q.type].map((l,k)=>`<tr><td>${l}</td><td class="mono"><b>${M.bands[CK[k]]!=null?Number(M.bands[CK[k]]).toFixed(1):'—'}</b></td></tr>`).join('')}</tbody></table></div>`:'';
    return `<div class="row wrap">${sc}</div>${cr}${M.fb?`<div class="fbq"><b>Izoh</b>${linkify(M.fb)}</div>`:''}`}
  return '';
}
function critTxt(b){if(!b)return '—';const v=CK.map(k=>b[k]);if(v.some(x=>x==null||x===''))return '—';return floorHalf(v.reduce((a,x)=>a+Number(x),0)/4).toFixed(1)}
function generalReview(w,s,mode){
  const ctx={w,s,mode};
  return `<div class="rq"><div class="rb" style="margin-left:0">${s.text?`<div class="essay">${linkify(s.text)}</div>`:'<p class="mute">Matnli javob yo‘q.</p>'}${filesHtml(s.files)}${manBlock({id:'_general',type:'general',pts:w.pts},ctx)}</div></div>`;
}

function grSet(el){
  const p=el.dataset.g;let v=el.value;
  if(p==='fb'){GR.fb=v;return}if(p==='bandOverride'){GR.bandOverride=v;return}
  const [qid,k,sub]=p.split('.');const M=GR.manual[qid]||(GR.manual[qid]={});
  if(k==='bands'){M.bands=M.bands||{};M.bands[sub]=v===''?null:Number(v);const o=$('#gb-'+qid);if(o)o.textContent=critTxt(M.bands)}
  else if(k==='fb')M.fb=v;else M[k]=v===''?null:Number(v);
}
async function grSave(ret){
  const r=await api('POST',`/subs/${GR.d.sub.id}/grade`,{manual:GR.manual,fb:GR.fb,bandOverride:GR.bandOverride,returned:ret});
  toast(ret?'Baholandi va o‘quvchiga qaytarildi':'Saqlandi');
  if(ret&&GR.d.nav.next)go(H('s',GR.d.nav.next));else route();
  return r;
}

   ${w.proctor?`<li>${ic('shield')}<span><b>Autoproctor yoqilgan.</b> Sahifa to‘liq ekranda ochiladi. Boshqa tab yoki oynaga o‘tish, to‘liq ekrandan chiqish, nusxa olish va matn qo‘yish qayd etiladi.</span></li>${CFG.camera!==false?`<li>${ic('cam')}<span><b>Kamera.</b> Kadrdagi yuz tekshiriladi va vaqti-vaqti bilan kichik surat olinadi. Ular faqat o‘qituvchingizga ko‘rinadi.</span></li>`:''}`:''}

   ${d.started&&w.proctor?'<p class="chip amb" style="justify-self:start">Siz bu ishni avval boshlagansiz — vaqt davom etmoqda</p>':''}
   <div class="row wrap"><a class="btn ghost" href="${H('w',wid)}">${ic('left')} Orqaga</a><span class="sp"></span><button class="btn lg" data-a="takeBegin">${d.started?'Davom ettirish':'Boshlash'}</button></div></div></div>`};

async function beginTake(){

function recInner(q){

  if(r.st==='prep')return `<div class="recst"><b>Tayyorlaning</b><span class="big">${fDur(r.left)}</span><button class="btn ghost sm" data-a="recNow" data-q="${q.id}">Hozir boshlash</button></div>`;

const recDraw=id=>{const q=TAKE.w.questions.find(x=>x.id===id),el=$('#rec-'+id);if(el&&q)el.innerHTML=recInner(q)};
async function recStart(id){
  const t=TAKE,q=t.w.questions.find(x=>x.id===id);

function recBegin(id){
  const t=TAKE,q=t.w.questions.find(x=>x.id===id),r=t.rec[id];if(!r)return;clearInterval(r.timer);
  const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'].find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m));
  try{r.mr=new MediaRecorder(r.stream,mime?{mimeType:mime}:undefined)}catch(e){r.stream.getTracks().forEach(x=>x.stop());delete t.rec[id];recDraw(id);return toast('Bu brauzer ovoz yozishni qo‘llab-quvvatlamaydi')}
  const chunks=[];r.mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  r.mr.onstop=async()=>{clearInterval(r.timer);r.stream.getTracks().forEach(x=>x.stop());if(TAKE!==t)return;r.st='up';recDraw(id);
    const type=(r.mr.mimeType||mime||'audio/webm').split(';')[0],blob=new Blob(chunks,{type});
    try{const f=await upload(blob,`speaking-${id}.${type.includes('mp4')?'m4a':type.includes('ogg')?'ogg':'webm'}`);t.ans[id]=f;saveDraft();updAnsCnt();delete t.rec[id]}catch(e){delete t.rec[id];toast(e.message)}recDraw(id)};
  r.st='rec';r.start=Date.now();r.el=0;r.mr.start(1000);
  r.timer=setInterval(()=>{r.el=Date.now()-r.start;if(r.el>=q.maxSec*1000){r.mr.state!=='inactive'&&r.mr.stop()}else recDraw(id)},250);recDraw(id);
}

const P={log:[],snaps:[],v:null,s:null,fd:null,h:[],t0:0,timer:null,n:0};
function pOn(tg,ev,f){tg.addEventListener(ev,f,true);P.h.push([tg,ev,f])}
function plog(k,m){P.log.push({t:Date.now(),k,m});if(P.log.length>300)P.log.shift();const c=$('#pvc');if(c){c.textContent=P.log.length;$('#pstat').classList.add('bad')}}
async function pStart(){
  P.log=[];P.snaps=[];P.n=0;P.t0=Date.now()+1e9;
  try{await document.documentElement.requestFullscreen()}catch(e){plog('fs-fail','To‘liq ekran yoqilmadi')}
  if(CFG.camera!==false){try{P.s=await navigator.mediaDevices.getUserMedia({video:{width:320,height:240},audio:false});P.v=document.createElement('video');P.v.autoplay=true;P.v.muted=true;P.v.playsInline=true;P.v.srcObject=P.s}
  catch(e){P.v=null;plog('cam-fail','Kamera ochilmadi yoki ruxsat berilmadi')}}else P.v=null;
  pOn(document,'visibilitychange',()=>{if(document.hidden)vio('tab','Boshqa tab yoki ilovaga o‘tildi')});
  pOn(window,'blur',()=>setTimeout(()=>{if(!document.hidden&&!document.hasFocus())vio('blur','Oyna fokusini yo‘qotdi')},150));
  pOn(document,'drop',e=>{const dt=e.dataTransfer;if(dt&&[...dt.types].includes('text/plain')){e.preventDefault();vio('paste','Matn sudrab tashlandi')}});
  pOn(document,'fullscreenchange',()=>{if(!document.fullscreenElement)vio('fs','To‘liq ekrandan chiqildi')});
  const L={copy:'Nusxa olishga urinish',cut:'Kesib olishga urinish',paste:'Matn qo‘yishga urinish',contextmenu:'O‘ng tugma bosildi'};
  ['copy','cut','paste','contextmenu'].forEach(ev=>pOn(document,ev,e=>{e.preventDefault();vio(ev,L[ev])}));
  pOn(document,'keydown',e=>{const k=(e.key||'').toLowerCase(),mod=e.ctrlKey||e.metaKey;if(k==='f12'||k==='printscreen'||(mod&&['p','s','u'].includes(k))||(mod&&e.shiftKey&&['i','j','c'].includes(k))){e.preventDefault();vio('key','Taqiqlangan tugma: '+e.key)}});
  clearInterval(P.timer);P.timer=setInterval(pTick,6000);P.t0=Date.now();
}
function vio(k,m){if(!TAKE||!TAKE.running||!TAKE.w.proctor||Date.now()-P.t0<1500)return;plog(k,m);snap(m);toast('Qayd etildi: '+m)}
function snap(why){if(!P.v||!P.v.videoWidth)return;const c=document.createElement('canvas');c.width=160;c.height=120;c.getContext('2d').drawImage(P.v,0,0,160,120);P.snaps.push({why,t:Date.now(),img:c.toDataURL('image/jpeg',.55)});if(P.snaps.length>16)P.snaps.shift()}
async function pTick(){
  if(!TAKE||!TAKE.running||!P.v||!P.v.videoWidth)return;P.n++;
  if('FaceDetector' in window){try{P.fd=P.fd||new FaceDetector({fastMode:true});const f=await P.fd.detect(P.v);if(!f.length)return vio('noface','Kadrda yuz ko‘rinmadi');if(f.length>1)return vio('multi','Kadrda bir nechta yuz bor')}catch(e){}}
  if(P.n%5===1)snap('Davriy tekshiruv');
}
function pStop(){clearInterval(P.timer);P.h.splice(0).forEach(([t,e,f])=>t.removeEventListener(e,f,true));if(P.s)P.s.getTracks().forEach(t=>t.stop());P.s=null;P.v=null;if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}

function analysisHtml(an,w){

  async genFile(){const fs=await pickFiles('',true);for(const f of fs){toast('Yuklanmoqda: '+f.name);try{TAKE.files.push(await upload(f));saveDraft();renderTake()}catch(e){toast(e.message)}}},
  genFileDel(d){TAKE.files.splice(+d.v,1);saveDraft();renderTake()},
  grSave(d){return grSave(d.v==='1')}
};
document.addEventListener('click',e=>{
  const um=$('details.um[open]');if(um&&!um.contains(e.target))um.removeAttribute('open');
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const f=A[b.dataset.a];if(!f)return;
  if(b.tagName==='BUTTON'||(b.tagName==='A'&&b.dataset.a!=='close'))e.preventDefault();
  if(b.tagName==='BUTTON'){if(b.dataset.busy)return;b.dataset.busy='1'}
  Promise.resolve().then(()=>f(b.dataset,b,e)).catch(err=>toast(err.message)).finally(()=>{delete b.dataset.busy});
});
function onField(e){const el=e.target;
  if(el.dataset.b!==undefined&&ED&&el.closest('.ed'))return edSet(el);
  if(el.dataset.ans!==undefined&&TAKE)return takeSet(el);
  if(el.dataset.g!==undefined&&GR)return grSet(el);
}
document.addEventListener('input',onField);document.addEventListener('change',onField);
