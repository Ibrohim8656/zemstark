<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--HEAD-->
<title>Zemstark</title>
<!--PWA--><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="theme-color" content="#3a57cf"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Zemstark"><!--/PWA-->
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: ilova qobig'i — yopishqoq sarlavha, markazlashgan ish maydoni (max 1120px), imtihon rejimida ikki panelli bo'lingan ekran */
:root{
  --bg:#f4f5f8;--sf:#ffffff;--sf2:#eef0f5;--ink:#141826;--mute:#5d6479;--line:#dfe2ea;
  --acc:#2747d8;--aci:#ffffff;--soft:#e7ecfd;--ring:rgba(39,71,216,.18);
  --hl:#ffe14d;--hli:#3b3000;
  --ok:#137a49;--okb:#e2f4ea;--warn:#c0362c;--warnb:#fbe8e6;--amb:#9a5a00;--ambb:#fdf0d8;
  --sk-grammar:#0f7a70;--sk-vocabulary:#c0246b;--sk-reading:#2747d8;--sk-listening:#7a3fe0;--sk-writing:#1c7c3c;--sk-speaking:#c4511a;--sk-mixed:#59607a;
  --f-d:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;--f-b:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--f-m:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --gl:max(16px,env(safe-area-inset-left,0px));--gr:max(16px,env(safe-area-inset-right,0px));
  --shadow:0 1px 2px rgba(20,24,38,.05),0 8px 24px rgba(20,24,38,.06);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f121a;--sf:#171b26;--sf2:#202533;--ink:#e8eaf1;--mute:#9aa1b5;--line:#2b3142;
  --acc:#8da2ff;--aci:#0c1440;--soft:#1f2a52;--ring:rgba(141,162,255,.25);--hl:#ffe14d;--hli:#2b2300;
  --ok:#5fd394;--okb:#14301f;--warn:#ff8b80;--warnb:#3a1b18;--amb:#f3b44d;--ambb:#33260f;
  --sk-grammar:#45d0c0;--sk-vocabulary:#f47bb8;--sk-reading:#8da2ff;--sk-listening:#b997ff;--sk-writing:#62d68f;--sk-speaking:#ff9f6b;--sk-mixed:#a5acc2;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f121a;--sf:#171b26;--sf2:#202533;--ink:#e8eaf1;--mute:#9aa1b5;--line:#2b3142;
  --acc:#8da2ff;--aci:#0c1440;--soft:#1f2a52;--ring:rgba(141,162,255,.25);--hl:#ffe14d;--hli:#2b2300;
  --ok:#5fd394;--okb:#14301f;--warn:#ff8b80;--warnb:#3a1b18;--amb:#f3b44d;--ambb:#33260f;
  --sk-grammar:#45d0c0;--sk-vocabulary:#f47bb8;--sk-reading:#8da2ff;--sk-listening:#b997ff;--sk-writing:#62d68f;--sk-speaking:#ff9f6b;--sk-mixed:#a5acc2;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-b);min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--sf)}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:40px;transition:border-color .15s,box-shadow .15s}
textarea{resize:vertical;line-height:1.55}
input[type=checkbox],input[type=radio]{width:auto;min-height:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--ring)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1,h2,h3{font-family:var(--f-d);letter-spacing:-.02em;text-wrap:balance;margin:0}
h1{font-size:clamp(24px,3vw,30px);line-height:1.15;font-weight:800}h2{font-size:19px;font-weight:700}h3{font-size:16px;font-weight:700}
p{margin:0}
.mute{color:var(--mute)}.sm{font-size:13px}.mono{font-family:var(--f-m)}.num{font-variant-numeric:tabular-nums}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sp{flex:1}
.row{display:flex;gap:10px;align-items:center}.wrap{flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--acc);color:var(--aci);border:1px solid transparent;border-radius:10px;padding:8px 16px;min-height:40px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none!important;transition:filter .15s,border-color .15s,background .15s}
.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:var(--sf);color:var(--ink);border-color:var(--line)}.btn.ghost:hover{border-color:var(--mute);filter:none}
.btn.danger{background:var(--warn);color:var(--sf)}.btn.sm{min-height:32px;padding:5px 11px;font-size:13px;border-radius:8px}.btn.sm .i{width:15px;height:15px}
.btn.lg{min-height:48px;padding:12px 22px;font-size:16px}.btn.block{width:100%}
.ib{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;border:0;background:none;color:var(--mute);cursor:pointer;flex:none}
.ib:hover{background:var(--sf2);color:var(--ink)}.ib.danger:hover{color:var(--warn)}.ib:disabled{opacity:.3;cursor:default;background:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;line-height:1;padding:5px 9px;border-radius:99px;background:var(--sf2);color:var(--mute);white-space:nowrap}
.chip .i{width:13px;height:13px}
.chip.ok{background:var(--okb);color:var(--ok)}.chip.warn{background:var(--warnb);color:var(--warn)}.chip.amb{background:var(--ambb);color:var(--amb)}.chip.acc{background:var(--soft);color:var(--acc)}
.chip.band{background:var(--hl);color:var(--hli);font-family:var(--f-m)}
.sk{--c:var(--sk-mixed);color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent)}
.sk-grammar{--c:var(--sk-grammar)}.sk-vocabulary{--c:var(--sk-vocabulary)}.sk-reading{--c:var(--sk-reading)}.sk-listening{--c:var(--sk-listening)}.sk-writing{--c:var(--sk-writing)}.sk-speaking{--c:var(--sk-speaking)}.sk-mixed{--c:var(--sk-mixed)}
.card{background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:20px}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:0 0 6px}
.hint{font-size:12.5px;color:var(--mute);line-height:1.45}
.err{color:var(--warn);font-size:13.5px;min-height:20px}
.fg{margin-bottom:16px}
.av{width:32px;height:32px;border-radius:50%;background:var(--soft);color:var(--acc);display:inline-grid;place-items:center;font-weight:700;font-size:12px;flex:none;font-family:var(--f-d)}
.av.lg{width:40px;height:40px;font-size:14px}
.empty{text-align:center;padding:44px 20px;border:1.5px dashed var(--line);border-radius:16px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty .i{width:38px;height:38px;stroke-width:1.4;color:var(--acc)}.empty h3{color:var(--ink)}.empty p{max-width:44ch}
.empty.sm{padding:24px 16px}.empty.sm .i{width:28px;height:28px}
.loading{display:grid;place-items:center;padding:100px 0}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;min-height:62px;padding-block:8px;padding-left:var(--gl);padding-right:var(--gr);background:var(--sf);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink)}.brand:hover{text-decoration:none}
.logo{width:34px;height:34px;border-radius:9px;background:var(--acc);color:var(--aci);display:grid;place-items:center;font:800 19px/1 var(--f-d);position:relative;flex:none}
.logo::after{content:"";position:absolute;right:-4px;bottom:-4px;width:12px;height:12px;border-radius:3px;background:var(--hl);border:2px solid var(--sf)}
.bt{display:flex;flex-direction:column;line-height:1.05}.bt b{font:800 18px var(--f-d);letter-spacing:-.02em}.bt small{color:var(--mute);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
details.um{position:relative}
details.um summary{list-style:none;display:flex;align-items:center;gap:8px;cursor:pointer;padding:3px 10px 3px 3px;border-radius:99px;border:1px solid var(--line)}
details.um summary::-webkit-details-marker{display:none}
.um .un{font-weight:600;font-size:14px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu{position:absolute;right:0;top:calc(100% + 8px);width:250px;background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:8px;box-shadow:var(--shadow);z-index:40}
.menu .mh{display:flex;flex-direction:column;gap:4px;padding:8px 10px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu .mh span{font-size:13px;color:var(--mute);overflow-wrap:anywhere}.menu .mh .chip{align-self:flex-start;margin-top:4px}
.menu a,.menu button{display:flex;gap:10px;align-items:center;width:100%;padding:9px 10px;border-radius:8px;border:0;background:none;cursor:pointer;color:var(--ink);text-align:left;font-size:14px}
.menu a:hover,.menu button:hover{background:var(--sf2);text-decoration:none}
@media(max-width:560px){.um .un{display:none}.bt small{display:none}}

main{max-width:1120px;margin:0 auto;padding-block:28px 90px;padding-left:var(--gl);padding-right:var(--gr)}
main.wide{max-width:1320px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.ph p{margin-top:6px}
.crumbs{margin-bottom:12px}.crumbs a{display:inline-flex;align-items:center;gap:4px;color:var(--mute);font-size:14px;font-weight:500}

/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:1.15fr 1fr}
.auth-hero{padding-block:56px;padding-left:max(6vw,var(--gl));padding-right:max(4vw,var(--gr));display:flex;flex-direction:column;justify-content:center;gap:22px;background:var(--sf);border-right:1px solid var(--line);position:relative;overflow:hidden}
.auth-hero>*{position:relative;z-index:1}
.auth-hero::after{content:"9.0";position:absolute;right:-24px;bottom:-70px;font:800 300px/1 var(--f-d);letter-spacing:-.06em;color:var(--sf2);z-index:0;pointer-events:none}
.auth-hero h1{font-size:clamp(30px,4vw,48px);line-height:1.04;max-width:13ch}
.auth-hero h1 mark{background:var(--hl);color:var(--hli);padding:0 .12em;border-radius:4px}
.auth-hero>p{font-size:17px;color:var(--mute);max-width:46ch}
.feat{list-style:none;padding:0;margin:0;display:grid;gap:14px;max-width:470px}
.feat li{display:flex;gap:12px;align-items:flex-start}.feat .i{color:var(--acc);margin-top:2px}.feat b{display:block}
.feat span{color:var(--mute);font-size:14px}
.skills4{display:flex;gap:8px;flex-wrap:wrap}
.auth-side{display:flex;align-items:center;justify-content:center;padding-block:40px;padding-left:var(--gl);padding-right:var(--gr)}
.auth-card{width:min(420px,100%);padding:30px}
.auth-card h2{font-size:24px}.auth-card>p{margin:6px 0 20px}
.auth-card form{display:flex;flex-direction:column}.auth-card form input{margin-bottom:14px}
.rolepick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.rolepick label{position:relative}
.rolepick input{position:absolute;opacity:0}
.rolepick span{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px;border:1.5px solid var(--line);border-radius:12px;cursor:pointer;font-size:14px;font-weight:600}
.rolepick input:checked+span{border-color:var(--acc);background:var(--soft);color:var(--acc)}
.rolepick input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
.swap{text-align:center;margin-top:16px;font-size:14px;color:var(--mute)}
.demo-box{margin-top:20px;padding:14px;border-radius:12px;background:var(--sf2);display:grid;gap:8px}
@media(max-width:880px){.auth{grid-template-columns:1fr}.auth-hero{padding-block:32px;border-right:0;border-bottom:1px solid var(--line)}.feat,.auth-hero::after{display:none}}

/* home */
.home{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;align-items:start}
@media(max-width:920px){.home{grid-template-columns:1fr}}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.ccard{--c:var(--sk-reading);display:flex;flex-direction:column;background:var(--sf);border:1px solid var(--line);border-radius:16px;overflow:hidden;color:var(--ink);transition:border-color .15s,transform .15s}
.ccard:hover{text-decoration:none;border-color:var(--c);transform:translateY(-2px)}
.ccard .ct{padding:18px 18px 22px;background:color-mix(in srgb,var(--c) 13%,var(--sf));position:relative;overflow:hidden;min-height:108px;display:flex;flex-direction:column;gap:4px}
.ccard .ct::after{content:"";position:absolute;right:-28px;top:-28px;width:120px;height:120px;border-radius:50%;border:20px solid color-mix(in srgb,var(--c) 20%,transparent)}
.ccard h3{font-size:19px;position:relative;z-index:1;overflow-wrap:anywhere}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--c,var(--acc));position:relative;z-index:1}
.ccard .cs{color:var(--mute);font-size:14px;position:relative;z-index:1}
.ccard .cb{padding:14px 18px;display:flex;align-items:center;gap:10px;justify-content:space-between;font-size:13px;color:var(--mute);border-top:1px solid var(--line)}
.side-card h2{display:flex;align-items:center;gap:8px;font-size:17px;margin-bottom:12px}
.tlist{display:grid;gap:2px}
.tlist a{display:flex;gap:12px;align-items:flex-start;padding:10px;border-radius:10px;color:var(--ink)}
.tlist a:hover{background:var(--sf2);text-decoration:none}
.tlist .tm{display:flex;flex-direction:column;gap:2px;min-width:0}.tlist b{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlist small{color:var(--mute);font-size:12.5px}.tlist small.od{color:var(--warn)}
.dot8{width:8px;height:8px;border-radius:50%;background:var(--c,var(--acc));margin-top:7px;flex:none}

/* class */
.banner{--c:var(--sk-reading);border-radius:20px;padding:28px;background:color-mix(in srgb,var(--c) 14%,var(--sf));border:1px solid color-mix(in srgb,var(--c) 26%,var(--line));display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-end;position:relative;overflow:hidden;min-height:150px}
.banner::after{content:"Aa";position:absolute;right:18px;top:-38px;font:800 170px/1 var(--f-d);color:color-mix(in srgb,var(--c) 15%,transparent);pointer-events:none}
.banner>*{position:relative;z-index:1}
.banner h1{font-size:clamp(26px,4vw,38px);overflow-wrap:anywhere}.banner p{color:var(--mute);margin-top:4px}
.codebox{background:var(--sf);border:1px solid var(--line);border-radius:12px;padding:10px 10px 10px 14px;display:flex;align-items:center;gap:12px}
.codebox small{display:block;font-size:11.5px;color:var(--mute);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.codebox b{font:700 21px var(--f-m);letter-spacing:.14em}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 24px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a,.tabs button{display:flex;align-items:center;gap:7px;padding:12px 14px;color:var(--mute);border:0;border-bottom:2.5px solid transparent;margin-bottom:-1px;white-space:nowrap;font-weight:600;background:none;cursor:pointer;font-size:14.5px}
.tabs a.on,.tabs button.on{color:var(--acc);border-color:var(--acc)}.tabs a:hover,.tabs button:hover{text-decoration:none;color:var(--ink)}
.stream{display:grid;grid-template-columns:270px minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:880px){.stream{grid-template-columns:1fr}.stream aside{order:2}}
.stream aside{display:grid;gap:14px}
.composer{display:grid;gap:10px;margin-bottom:16px}
.composer textarea{min-height:84px}
.post,.fw{background:var(--sf);border:1px solid var(--line);border-radius:16px;margin-bottom:12px}
.post{padding:16px 18px}
.pmeta{display:flex;gap:10px;align-items:center}.pmeta b{display:block;font-size:14.5px}.pmeta small{color:var(--mute);font-size:12.5px}
.ptext{margin-top:12px;overflow-wrap:anywhere;line-height:1.6}
.fw{display:flex;gap:14px;align-items:center;padding:14px 18px;color:var(--ink)}
.fw:hover{text-decoration:none;border-color:var(--acc)}
.fw .fm{flex:1;min-width:0}.fw .fm b{display:block;font-weight:600;overflow-wrap:anywhere}.fw .fm small{color:var(--mute);font-size:12.5px}
.att{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.fchip{display:inline-flex;align-items:center;gap:8px;padding:6px 6px 6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--sf2);font-size:13px;max-width:100%;color:var(--ink);min-height:36px}
a.fchip{padding-right:12px}a.fchip:hover{text-decoration:none;border-color:var(--acc)}
.fchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

/* works list */
.toolbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--sf);border-radius:99px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--mute)}
.filters button:hover{border-color:var(--mute);color:var(--ink)}
.filters button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.topic{margin-top:22px}
.topic h2{font-size:21px;padding:0 4px 10px;border-bottom:1px solid var(--line);margin-bottom:6px;display:flex;align-items:baseline;gap:10px}
.topic h2 small{font:500 13px var(--f-b);color:var(--mute);letter-spacing:0}
.wrow{display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:12px;color:var(--ink)}
.wrow:hover{background:var(--sf);text-decoration:none;box-shadow:0 0 0 1px var(--line)}
.wico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--acc);flex:none}
.wico.k-ielts{background:var(--hl);color:var(--hli)}.wico.k-material{background:var(--sf2);color:var(--mute)}.wico.k-quiz{background:var(--okb);color:var(--ok)}
.wico.big{width:54px;height:54px}.wico.big .i{width:24px;height:24px}
.wmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.wmain>b{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--mute)}
.meta .sep{display:inline-flex;align-items:center;gap:4px}.meta .sep .i{width:14px;height:14px}
.wside{flex:none;text-align:right;font-size:13px;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
@media(max-width:620px){.wrow{flex-wrap:wrap}.wside{width:100%;padding-left:54px;align-items:flex-start;text-align:left}}

/* people, tables */
.plist{display:grid}
.prow{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.prow .pm{flex:1;min-width:0}.prow .pm b{display:block;font-weight:600}.prow .pm small{color:var(--mute);font-size:13px;overflow-wrap:anywhere}
.sect-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:2px solid var(--acc);padding-bottom:10px;margin:0 0 4px}
.sect-h h2{color:var(--acc);font-size:22px}
.twrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--sf)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--mute);font-weight:600;background:var(--sf2);white-space:nowrap}
tr:last-child td{border-bottom:0}
.gb th.wk{white-space:normal;min-width:120px;max-width:160px;line-height:1.3}
.gb th.wk a{color:var(--ink);font-weight:600}
.gb td:first-child,.gb th:first-child{position:sticky;left:0;background:var(--sf);z-index:1;min-width:170px}
.gb th:first-child{background:var(--sf2)}
.cell{display:inline-flex;min-width:58px;justify-content:center;padding:4px 8px;border-radius:8px;font-weight:600;font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink)}
a.cell:hover{text-decoration:none;outline:1px solid var(--acc)}
.cell.ok{background:var(--okb);color:var(--ok)}.cell.amb{background:var(--ambb);color:var(--amb)}.cell.warn{background:var(--warnb);color:var(--warn)}.cell.band{background:var(--hl);color:var(--hli);font-family:var(--f-m)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat span{font-size:12.5px;color:var(--mute);font-weight:500}.stat b{display:block;font:800 28px/1.15 var(--f-d);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
@media(max-width:720px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.trows{border:1px solid var(--line);border-radius:14px;background:var(--sf);overflow:hidden}
.trow{display:grid;grid-template-columns:minmax(150px,1.6fr) 1.1fr 1.2fr .8fr .7fr 20px;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);color:var(--ink);font-size:14px}
.trow:last-child{border-bottom:0}.trow.th{font-size:12px;color:var(--mute);font-weight:600;background:var(--sf2)}
a.trow:hover{background:var(--sf2);text-decoration:none}
.who{display:flex;align-items:center;gap:10px;min-width:0}.who b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:760px){.trow{grid-template-columns:minmax(0,1fr) auto}.trow .hm{display:none}}

/* progress */
.overall{display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin-bottom:18px}
.bigband{width:118px;height:118px;border-radius:24px;background:var(--hl);color:var(--hli);display:grid;place-items:center;text-align:center;flex:none}
.bigband b{font:800 46px/1 var(--f-m);letter-spacing:-.04em}.bigband small{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.bigband.none{background:var(--sf2);color:var(--mute)}
.bands{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:22px}
@media(max-width:820px){.bands{grid-template-columns:repeat(2,minmax(0,1fr))}}
.bandc{--c:var(--sk-reading);background:var(--sf);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.bandc .bh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bandc .bh span{font-weight:700;color:var(--c);display:flex;gap:6px;align-items:center}
.bandc .bv{font:800 38px/1 var(--f-m);letter-spacing:-.04em;font-variant-numeric:tabular-nums}.bandc .bv.na{color:var(--mute);font-size:26px}
.bars{display:flex;align-items:flex-end;gap:4px;height:52px;border-bottom:1px solid var(--line)}
.bars i{flex:1;max-width:22px;background:var(--c);border-radius:4px 4px 0 0;min-height:3px}
.bars i:last-child{outline:2px solid color-mix(in srgb,var(--c) 40%,transparent);outline-offset:1px}

/* editor */
.ed-top{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:12;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;background:var(--bg);margin:-14px 0 18px;border-bottom:1px solid var(--line)}
.ed-title{display:flex;flex-direction:column;line-height:1.25;min-width:0}.ed-title b{font:700 17px var(--f-d)}.ed-title span{font-size:12.5px}
.ed{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
.ed-side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 140px);max-height:calc(100vh - 160px);overflow:auto}
@media(max-width:980px){.ed{grid-template-columns:1fr}.ed-side{position:static;max-height:none}}
.ed-basic{display:grid;gap:10px}
.title-in{font:700 23px var(--f-d);letter-spacing:-.01em;border:0;border-bottom:2px solid var(--line);border-radius:0;padding:6px 2px;background:transparent}
.title-in:focus{box-shadow:none;border-color:var(--acc)}
.ed-err{background:var(--warnb);color:var(--warn);border-radius:12px;padding:12px 14px;font-weight:600;display:flex;gap:10px;align-items:flex-start;margin-bottom:14px}
.qcard{background:var(--sf);border:1px solid var(--line);border-radius:14px;margin-top:14px;overflow:hidden}
.qcard:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px var(--ring)}
.qh{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;border-bottom:1px solid var(--line);background:var(--sf2);flex-wrap:wrap}
.qh>b{font-size:14px}
.qn{min-width:30px;height:26px;padding:0 8px;border-radius:7px;background:var(--acc);color:var(--aci);display:inline-flex;align-items:center;justify-content:center;font:700 13px var(--f-m);flex:none}
.qn .i{width:15px;height:15px}
.qcard.sec .qh{background:color-mix(in srgb,var(--hl) 35%,var(--sf))}.qcard.sec .qn{background:var(--hl);color:var(--hli)}
.qtools{display:flex;gap:2px}
.pts{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mute);font-weight:600}.pts input{width:68px;min-height:32px;padding:4px 8px}
.qb{padding:14px;display:flex;flex-direction:column;gap:10px}
.qb details summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--mute);padding:4px 0}
.qb details textarea{margin-top:8px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:8px;align-items:center}
.ck{display:inline-flex;align-items:center;gap:8px;cursor:pointer;position:relative;font-size:14px}
.opt .ck input,.seg input,.tog input,.topt input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.opt .ck span{width:34px;height:34px;border-radius:9px;border:1.5px solid var(--line);display:grid;place-items:center;font:700 13px var(--f-m);color:var(--mute)}
.opt .ck input:checked+span{background:var(--ok);border-color:var(--ok);color:var(--sf)}
.opt .ck input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg label{cursor:pointer;position:relative}
.seg span{display:block;padding:8px 14px;font-size:14px;font-weight:600;border-left:1px solid var(--line);background:var(--sf)}
.seg label:first-child span{border-left:0}
.seg input:checked+span{background:var(--ok);color:var(--sf)}
.seg input:focus-visible+span{outline:2px solid var(--acc);outline-offset:-2px}
.seg.take input:checked+span{background:var(--acc);color:var(--aci)}
.pairs{display:grid;gap:8px}
.pair{display:grid;grid-template-columns:26px minmax(0,1fr) 18px minmax(0,1fr) 32px;gap:8px;align-items:center}
.pair .pn{font:700 13px var(--f-m);color:var(--mute);text-align:center}.pair .ar{color:var(--mute);text-align:center}
@media(max-width:620px){.pair{grid-template-columns:22px minmax(0,1fr) 32px}.pair .ar{display:none}.pair input:last-of-type{grid-column:2}}
.inl{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--mute);white-space:nowrap}.inl input{width:84px}
.addq{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:16px;border:1.5px dashed var(--line);border-radius:14px;margin-top:16px}
.addq .lbl{margin:0 6px 0 0}
.tog{display:flex;gap:12px;align-items:flex-start;padding:12px 0;cursor:pointer;border-top:1px solid var(--line);position:relative}
.sw{width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .2s;margin-top:1px}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--sf);transition:left .2s}
.tog input:checked+.sw{background:var(--acc)}.tog input:checked+.sw::after{left:19px}
.tog input:focus-visible+.sw{outline:2px solid var(--acc);outline-offset:2px}
.tog b{display:block;font-size:14px}.tog small{display:block;color:var(--mute);font-size:12.5px}
.flist{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.sum div{background:var(--sf2);border-radius:10px;padding:10px 12px}.sum span{display:block;font-size:12px;color:var(--mute)}.sum b{font:800 22px var(--f-d)}
.tpl{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:color-mix(in srgb,var(--hl) 22%,var(--sf));border-color:color-mix(in srgb,var(--hl) 60%,var(--line));margin-top:14px}
.tpl p{margin-top:4px;font-size:14px;max-width:60ch}

/* work page */
.whead{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:6px}
.wt{flex:1;min-width:220px;display:flex;flex-direction:column;gap:10px}
.wact{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media(max-width:920px){.sgrid{grid-template-columns:1fr}.sgrid>aside{order:-1}}
.desc{line-height:1.65;overflow-wrap:anywhere}
.info{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.info li{display:flex;gap:10px;align-items:center;color:var(--mute);font-size:14px}.info li b{color:var(--ink)}
.status{display:grid;gap:14px}
.status .big{font:800 44px/1 var(--f-d);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.status .big small{font-size:20px;color:var(--mute);font-weight:700}
.bandbox{display:flex;align-items:center;gap:14px}
.bandbox .bb{width:84px;height:84px;border-radius:18px;background:var(--hl);color:var(--hli);display:grid;place-items:center;font:800 34px var(--f-m);letter-spacing:-.04em;flex:none}
.fbq{background:var(--sf2);border-radius:12px;padding:12px 14px;font-size:14.5px;line-height:1.6;overflow-wrap:anywhere}
.fbq b{display:block;font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
audio{width:100%;max-width:560px;height:42px;display:block}
iframe.html{width:100%;height:480px;border:1px solid var(--line);border-radius:12px;background:#fff;display:block}
.mediabox{display:grid;gap:12px;margin-top:14px}

/* review */
.rq{padding:18px 0;border-bottom:1px solid var(--line)}.rq:last-child{border-bottom:0}
.rqh{display:flex;gap:12px;align-items:flex-start}
.rqt{flex:1;min-width:0;line-height:1.6;overflow-wrap:anywhere;padding-top:2px}
.qs{font:700 12px var(--f-m);padding:5px 8px;border-radius:8px;background:var(--sf2);white-space:nowrap}
.qs.ok{background:var(--okb);color:var(--ok)}.qs.no{background:var(--warnb);color:var(--warn)}.qs.part{background:var(--ambb);color:var(--amb)}
.rb{margin:12px 0 0 42px;display:grid;gap:8px;min-width:0}
@media(max-width:620px){.rb{margin-left:0}}
.ropts{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.ropts li{display:flex;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:10px;font-size:14.5px}
.ropts li.me{border-color:var(--acc);background:var(--soft)}
.ropts li.cor{border-color:var(--ok);background:var(--okb)}
.ropts li.wrong{border-color:var(--warn);background:var(--warnb)}
.ropts em{margin-left:auto;font-style:normal;font-size:12px;color:var(--ok);font-weight:700;white-space:nowrap}
.lt{width:26px;height:26px;border-radius:7px;background:var(--sf2);display:grid;place-items:center;font:700 12px var(--f-m);flex:none}
.gtext{line-height:2.4;font-size:16px;overflow-wrap:anywhere}
.gv{display:inline-block;padding:0 8px;line-height:1.7;border-radius:6px;background:var(--sf2);font-weight:600;border-bottom:2px solid var(--line)}
.gv.ok{background:var(--okb);color:var(--ok);border-color:var(--ok)}.gv.no{background:var(--warnb);color:var(--warn);border-color:var(--warn)}
.gv.key{background:var(--okb);color:var(--ok);border-color:var(--ok)}
.gc{font-size:12.5px;color:var(--ok);font-weight:700;margin:0 4px}
.cor{font-size:13.5px;color:var(--ok);font-weight:600}
.mtbl td{padding:8px 10px;font-size:14.5px}
.seq{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.seq span{padding:4px 10px;border-radius:8px;background:var(--sf2);border:1px solid var(--line);font-size:14.5px}
.seq.ok span{background:var(--okb);border-color:var(--ok)}.seq.no span{background:var(--warnb);border-color:var(--warn)}.seq.key span{background:var(--okb);border-color:var(--ok)}
.essay{white-space:pre-wrap;background:var(--sf2);border-radius:12px;padding:16px 18px;line-height:1.75;font-size:15.5px;overflow-wrap:anywhere;font-family:var(--f-b)}
.mgrade{padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);display:grid;gap:10px}
.crit{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:10px;align-items:center;font-size:14px}
.crit select{min-height:36px;padding:4px 8px;font-family:var(--f-m)}
.ov{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);font-weight:600}.ov input{width:70px;min-height:30px;padding:3px 8px}
.secrev{padding:18px 0 6px}.secrev h3{font-size:18px}
.wp-img{max-width:100%;border-radius:10px;border:1px solid var(--line);display:block;margin-top:10px}

/* grading */
.grh{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.grh .gm{flex:1;min-width:200px}.grh .gm h1{font-size:24px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:20px;align-items:start}
.grid2>aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);display:grid;gap:14px}
@media(max-width:1020px){.grid2{grid-template-columns:1fr}.grid2>aside{position:static}}
.res{display:grid;gap:12px}
.res .rr{display:flex;justify-content:space-between;font-size:14px;color:var(--mute)}.res .rr b{color:var(--ink);font-variant-numeric:tabular-nums}
.plog{list-style:none;padding:0;margin:0;font-size:13px;max-height:240px;overflow:auto;display:grid}
.plog li{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}.plog time{color:var(--mute);font-family:var(--f-m);font-size:12px;flex:none}
.snaps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.snaps img{width:100%;border-radius:8px;border:1px solid var(--line);aspect-ratio:4/3;object-fit:cover;display:block}
.meter{height:8px;border-radius:99px;background:var(--sf2);overflow:hidden}.meter i{display:block;height:100%;background:var(--warn);border-radius:99px}

/* take */
.tbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;min-height:62px;padding-block:8px;padding-left:var(--gl);padding-right:var(--gr);background:var(--sf);border-bottom:1px solid var(--line)}
.tb-l{display:flex;gap:10px;align-items:center;min-width:0}.tb-l>div{min-width:0}.tb-l b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-d);font-size:16px}
.tb-r{display:flex;justify-content:flex-end;align-items:center;gap:10px}
.timer{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;background:var(--sf2);font:700 18px var(--f-m);font-variant-numeric:tabular-nums}
.timer.warn{background:var(--ambb);color:var(--amb)}.timer.crit{background:var(--warnb);color:var(--warn);animation:pulse 1s infinite}
.pcam video{width:58px;height:44px;border-radius:8px;object-fit:cover;transform:scaleX(-1);display:block;background:#000}
.pstat{display:inline-flex;gap:5px;align-items:center;font-weight:700;font-size:13px;color:var(--ok);padding:5px 9px;border-radius:99px;background:var(--okb)}
.pstat.bad{color:var(--warn);background:var(--warnb)}
@media(max-width:640px){.tbar{grid-template-columns:minmax(0,1fr) auto}.tb-c{grid-column:1/-1;grid-row:2;justify-self:center}.hide-sm{display:none}}
.take{max-width:880px;margin:0 auto;padding-block:26px 90px;padding-left:var(--gl);padding-right:var(--gr)}
.take.split{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);padding:0;height:calc(100vh - 62px - env(safe-area-inset-top,0px))}
.take.split .pp,.take.split .qpane{overflow:auto;height:100%;min-width:0}
.take.split .pp{border-right:1px solid var(--line);background:var(--sf)}
.take.split .qin{max-width:740px;margin:0 auto;padding-block:24px 80px;padding-left:24px;padding-right:var(--gr)}
.passage{padding-block:26px 80px;padding-left:var(--gl);padding-right:30px;max-width:780px;margin:0 auto;font-size:16.5px;line-height:1.8;font-family:var(--f-b)}
.passage h2{margin-bottom:14px}.passage p{margin:0 0 1em}
.pp-tabs{position:sticky;top:0;display:flex;gap:6px;padding:10px 16px;background:var(--sf);border-bottom:1px solid var(--line);overflow-x:auto;z-index:2}
.pp-tabs button{border:1px solid var(--line);background:var(--sf);padding:6px 13px;border-radius:99px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;color:var(--mute)}
.pp-tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mview{display:none}
@media(max-width:900px){.take.split{display:block;height:auto}.take.split .pp{height:auto;border-right:0}.take.split .qpane{height:auto}.take.split .qin{padding-left:var(--gl)}
  .mview{display:flex;gap:4px;position:sticky;top:calc(var(--tbh,62px) + env(safe-area-inset-top,0px));z-index:15;padding:6px var(--gr) 6px var(--gl);background:var(--sf);border-bottom:1px solid var(--line)}
  .mview button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:40px;border:0;border-radius:10px;background:none;color:var(--mute);font-weight:600;cursor:pointer}
  .mview button[aria-selected="true"]{background:var(--soft);color:var(--acc)}
  .take.split.mv-p .qpane{display:none}.take.split.mv-q .pp{display:none}
  .passage{padding-left:var(--gl);padding-right:var(--gr);font-size:16px}
  .take-end .btn{width:100%}}
.intro{margin-bottom:18px}
.tq{background:var(--sf);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:0 0 12px}
.tqh{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.tqh .qn{background:var(--ink);color:var(--bg)}
.tqh .tt{flex:1;min-width:0;line-height:1.6;overflow-wrap:anywhere;padding-top:1px}
.need{display:inline-block;margin-top:4px;font-size:12.5px;font-weight:700;color:var(--acc);text-transform:uppercase;letter-spacing:.05em}
.topts{display:grid;gap:8px}
.topt{display:flex;gap:12px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;position:relative;line-height:1.45}
.topt:hover{border-color:var(--mute)}
.topt:has(input:checked){border-color:var(--acc);background:var(--soft)}
.topt:has(input:checked) .lt{background:var(--acc);color:var(--aci)}
.topt:has(input:focus-visible){outline:2px solid var(--acc);outline-offset:2px}
.gin{display:inline-block;width:150px;max-width:100%;min-height:34px;padding:3px 10px;margin:0 3px;border-radius:8px;text-align:center;font-weight:600}
.gin::placeholder{font:700 12px var(--f-m);color:var(--mute)}
.bank{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border:1.5px dashed var(--line);border-radius:10px;margin-bottom:12px;align-items:center}
.bank small{font-size:12px;color:var(--mute);font-weight:600;margin-right:4px}
.bank span{padding:4px 10px;background:var(--sf2);border-radius:8px;font-weight:600;font-size:14px}
.rlist{list-style:none;padding:0;margin:0 0 12px;display:grid;gap:6px}
.rlist li{display:flex;gap:10px;align-items:flex-start;line-height:1.45}
.mrows{display:grid}
.mrow{display:grid;grid-template-columns:auto minmax(0,1fr) 104px;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.mrow select{font-family:var(--f-m);font-weight:700}
.olist{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.olist li{display:flex;align-items:center;gap:6px;padding:4px 4px 4px 12px;border:1px solid var(--line);border-radius:10px;background:var(--sf2)}
.olist li span{flex:1;min-width:0;overflow-wrap:anywhere}
.olist .on{font:700 12px var(--f-m);color:var(--mute);flex:none}
.wpbox{background:var(--sf2);border-radius:12px;padding:14px 16px;margin-bottom:12px;line-height:1.65;overflow-wrap:anywhere}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);margin-bottom:6px}
.essay-in{min-height:340px;font-size:16px;line-height:1.75}
.wc{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mute);margin-top:6px;font-variant-numeric:tabular-nums}

.cue{background:var(--sf2);border-radius:12px;padding:16px;margin-bottom:12px;line-height:1.7;overflow-wrap:anywhere}
.rec{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.recst{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;background:var(--sf2);flex-wrap:wrap}
.recst.live{background:var(--warnb);color:var(--warn)}
.recst .big{font:700 20px var(--f-m);font-variant-numeric:tabular-nums}
.rdot{width:10px;height:10px;border-radius:50%;background:var(--warn);animation:pulse 1s infinite}
.aonce{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--sf2);flex-wrap:wrap}
.abar{flex:1;min-width:120px;height:6px;border-radius:99px;background:var(--line);overflow:hidden}.abar i{display:block;height:100%;width:0;background:var(--acc)}
.atime{font:600 13px var(--f-m);color:var(--mute);font-variant-numeric:tabular-nums}
.tsec{margin:30px 0 14px;display:grid;gap:10px}.tsec h2{font-size:20px}
.take-end{display:flex;justify-content:center;padding:26px 0}
.gate{max-width:600px;margin:6vh auto;padding-block:0;padding-left:var(--gl);padding-right:var(--gr)}
.gate .card{padding:28px;display:grid;gap:16px}
.rules{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.rules li{display:flex;gap:12px;align-items:flex-start;line-height:1.5}.rules .i{color:var(--acc);margin-top:2px}

/* html topshiriq */
.zfw{border:1px solid var(--line);border-radius:14px;background:#fff;padding:10px 14px;overflow:hidden;margin-top:4px}
.zf{display:block;width:100%;border:0;background:#fff;min-height:80px;height:420px;transition:height .15s}
.hchoice{display:grid;gap:10px;margin-top:16px}
.hc{display:flex;gap:14px;align-items:flex-start;text-align:left;padding:16px;border:1.5px solid var(--line);border-radius:14px;background:var(--sf);cursor:pointer;color:var(--ink);width:100%;font:inherit}
.hc:hover{border-color:var(--acc);background:var(--soft)}.hc:disabled{opacity:.55;cursor:not-allowed;background:var(--sf)}
.hc b{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}.hc small{display:block;color:var(--mute);font-size:13.5px;line-height:1.5}.hc small.warnc{color:var(--amb);margin-top:6px}
.hk{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:10px}
.hf{display:grid;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.hfl{display:flex;gap:8px;align-items:center;font-size:14px;flex-wrap:wrap}.hfl>span:last-child{overflow-wrap:anywhere;min-width:0}
.hopts{display:flex;flex-wrap:wrap;gap:6px}
.hopt{display:inline-flex;gap:6px;align-items:center;padding:5px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--sf);cursor:pointer;font:inherit;font-size:13.5px;color:var(--ink)}
.hopt .lt{width:22px;height:22px;font-size:11px}
.hopt.on{border-color:var(--ok);background:var(--okb);color:var(--ok)}.hopt.on .lt{background:var(--ok);color:var(--sf)}
.toggles2 .tog:first-child{border-top:0}
.addq .btn.hl{background:var(--hl);color:var(--hli);border-color:transparent}

/* lug'at, tahlil, ai */
.cards-ed{display:grid;gap:8px}
.cardrow{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1.2fr) minmax(0,1.4fr) 32px;gap:8px;align-items:center}
.cardrow .pn{font:700 12px var(--f-m);color:var(--mute);text-align:center}
@media(max-width:700px){.cardrow{grid-template-columns:22px minmax(0,1fr) 32px}.cardrow input:nth-of-type(2),.cardrow input:nth-of-type(3){grid-column:2}}
.rbar{height:8px;border-radius:99px;background:var(--sf2);overflow:hidden;min-width:60px}.rbar i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.rbar i.amb{background:var(--amb)}.rbar i.warn{background:var(--warn)}
.antbl td{vertical-align:top}.antbl .q{max-width:420px;min-width:180px;white-space:normal}.antbl .q small{display:block;color:var(--ok);font-weight:600;margin-top:2px}
.antbl .pc{display:grid;grid-template-columns:minmax(70px,1fr) 44px;gap:8px;align-items:center;min-width:130px}
.dist{display:flex;flex-wrap:wrap;gap:4px;max-width:360px}.dist span{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--sf2);white-space:nowrap}
.dist span.ok{background:var(--okb);color:var(--ok);font-weight:600}.dist span.bad{background:var(--warnb);color:var(--warn)}
.bdist{display:flex;align-items:flex-end;gap:6px;height:90px;padding:6px 0;border-bottom:1px solid var(--line)}
.bdist div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;justify-content:flex-end;height:100%}.bdist i{display:block;width:100%;max-width:34px;background:var(--hl);border-radius:5px 5px 0 0;min-height:2px}
.bdist small{font:600 11px var(--f-m);color:var(--mute)}
.aibox{border:1px dashed color-mix(in srgb,var(--acc) 45%,var(--line));background:var(--soft);border-radius:12px;padding:12px 14px;font-size:14px;display:grid;gap:6px}
.aibox ul{margin:0;padding-left:18px}.aibox b{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--acc)}
.vp{max-width:640px;margin:0 auto;padding-block:28px 80px;padding-left:var(--gl);padding-right:var(--gr);display:grid;gap:16px}
.vcard{background:var(--sf);border:1px solid var(--line);border-radius:20px;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:28px;text-align:center;cursor:pointer;box-shadow:var(--shadow)}
.vcard .vw{font:800 clamp(28px,6vw,44px)/1.15 var(--f-d);letter-spacing:-.02em;overflow-wrap:anywhere}
.vcard .vt{font-size:20px;font-weight:600;color:var(--acc);overflow-wrap:anywhere}.vcard .vx{color:var(--mute);font-style:italic;max-width:46ch}
.vcard input{max-width:360px;text-align:center;font-size:20px;font-weight:600}
.vbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}.vbtns .btn{min-height:54px;font-size:16px}
.btn.no{background:var(--warnb);color:var(--warn)}.btn.yes{background:var(--okb);color:var(--ok)}
.vprog{height:6px;border-radius:99px;background:var(--sf2);overflow:hidden}.vprog i{display:block;height:100%;background:var(--acc)}
.lvl{display:inline-flex;gap:3px}.lvl i{width:7px;height:7px;border-radius:50%;background:var(--line)}.lvl i.on{background:var(--ok)}
.kbd{font:600 11px var(--f-m);padding:1px 6px;border:1px solid var(--line);border-radius:5px;color:var(--mute)}

/* dialog & toast */
dialog{border:0;border-radius:18px;padding:24px;width:min(480px,calc(100vw - 32px));max-height:calc(100vh - 40px);overflow:auto;background:var(--sf);color:var(--ink);box-shadow:0 24px 70px rgba(0,0,0,.28)}
dialog.wide{width:min(720px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(10,12,22,.55)}
dialog h3{font-size:20px;margin-bottom:6px}
.dlg-act{display:flex;justify-content:flex-end;gap:10px;margin-top:22px;flex-wrap:wrap}
.kpick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.kpick a{display:flex;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;color:var(--ink);align-items:flex-start}
.kpick a:hover{border-color:var(--acc);text-decoration:none;background:var(--soft)}
.kpick a b{display:block;margin-bottom:2px}.kpick a small{color:var(--mute);font-size:13px;line-height:1.4;display:block}
@media(max-width:560px){.kpick{grid-template-columns:1fr}}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100;max-width:calc(100vw - 32px);box-shadow:var(--shadow)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ===== Soddalashtirilgan zamonaviy qatlam: kamroq bezak, yengil chegaralar, bir xil burchaklar ===== */
:root{--r:14px;
  /* kunduzgi rejim: iliq, ko'zni charchatmaydigan "qog'oz" ranglari */
  --bg:#f4f1ea;--sf:#fcfbf7;--sf2:#efebe2;--ink:#2b2e35;--mute:#666a73;--line:#e4dfd4;
  --acc:#3a57cf;--aci:#ffffff;--soft:#e8eaf6;--ring:rgba(58,87,207,.16);
  --shadow:0 1px 2px rgba(60,50,30,.05),0 8px 24px rgba(60,50,30,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1017;--sf:#151922;--sf2:#1c212c;--line:#262c39;--ink:#e8eaf1;--mute:#9aa1b5;--acc:#8da2ff;--aci:#0c1440;--soft:#1f2a52;--ring:rgba(141,162,255,.25);--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--bg:#0d1017;--sf:#151922;--sf2:#1c212c;--line:#262c39;--ink:#e8eaf1;--mute:#9aa1b5;--acc:#8da2ff;--aci:#0c1440;--soft:#1f2a52;--ring:rgba(141,162,255,.25);--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3)}
html{transition:background-color .25s}body{transition:background-color .25s,color .25s}
/* til va rejim tugmalari */
.prefs{display:flex;align-items:center;gap:6px}
.lang{display:inline-flex;padding:3px;border-radius:99px;background:var(--sf2);border:1px solid var(--line)}
.lang button{border:0;background:none;font:600 12px/1 var(--f-b);letter-spacing:.04em;padding:6px 9px;border-radius:99px;color:var(--mute);cursor:pointer;min-width:32px}
.lang button:hover{color:var(--ink)}
.lang button[aria-pressed="true"]{background:var(--sf);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.th{border:1px solid var(--line);border-radius:99px;width:34px;height:34px}
.auth{position:relative}
.auth-prefs{position:absolute;z-index:5;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px))}
@media(max-width:560px){header.top{gap:8px}.lang button{padding:6px 7px;min-width:28px}}
/* profil va hisoblar */
.prof{display:grid;gap:16px;max-width:720px}
.prof .card h2{display:flex;align-items:center;gap:8px}
.ro{padding:9px 12px;border-radius:10px;background:var(--sf2);border:1px solid var(--line);overflow-wrap:anywhere}
.banner-warn{display:flex;gap:12px;align-items:flex-start;max-width:720px;padding:14px 16px;margin-bottom:16px;border-radius:var(--r);background:var(--ambb);color:var(--amb)}
.banner-warn b{display:block;color:var(--ink)}.banner-warn span{color:var(--ink);opacity:.8;font-size:14px}
.tg-on{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.prefs.big .lang button{padding:8px 14px;font-size:13px}.prefs.big .th{width:40px;height:40px}
.forgot{margin:-6px 0 10px;text-align:right;font-size:13px}.forgot-t{margin:-4px 0 12px;padding:10px 12px;border-radius:10px;background:var(--sf2)}
.creds{width:100%;border-collapse:collapse;font-size:14px}.creds th,.creds td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
.creds th{font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.tbl-wrap{overflow-x:auto;max-width:100%}
/* savol qo'shish va import */
.addq .impbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;width:100%;padding-top:10px;margin-top:4px;border-top:1px dashed var(--line)}
.addq.pulse{border-color:var(--acc);box-shadow:0 0 0 4px var(--ring);transition:box-shadow .3s}
.start{margin-top:14px;padding:20px;border-radius:var(--r);background:var(--sf);border:1px solid var(--line)}
.start h3{margin-bottom:14px}.start>.hint{margin-top:12px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.sg{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--sf);color:var(--ink);cursor:pointer;font:inherit;transition:border-color .15s,background .15s}
.sg:hover{border-color:var(--acc);background:var(--soft)}
.sg b{display:block;margin-bottom:3px}.sg small{color:var(--mute);font-size:13px;line-height:1.4;display:block}
.sg.main{border-color:color-mix(in srgb,var(--acc) 45%,var(--line));background:color-mix(in srgb,var(--soft) 55%,var(--sf))}
.imp-help{margin:10px 0;font-size:14px}.imp-help summary{cursor:pointer;color:var(--acc);font-weight:600}
.imp-help ul{margin:8px 0 0;padding-left:18px;display:grid;gap:8px;color:var(--mute)}.imp-help li b{color:var(--ink);margin-right:6px}.imp-help li code{display:inline-block;margin-left:6px}.imp-help code{font-family:var(--f-m);font-size:12.5px;background:var(--sf2);padding:1px 5px;border-radius:5px;color:var(--ink)}
.imp-sum{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--sf2)}
.imp-sum.err{color:var(--warn);background:var(--warnb)}
.imp-list{margin:10px 0 0;padding-left:28px;max-height:300px;overflow:auto;display:grid;gap:6px;font-size:14px}
.imp-list li{padding:6px 8px;border-radius:8px}.imp-list li.miss{background:var(--ambb)}
.imp-list li .chip{margin-right:6px;vertical-align:1px}.imp-list li small{display:block;color:var(--mute);margin-top:2px}
.spin.sm{width:16px;height:16px;border-width:2px;display:inline-block;vertical-align:-3px;margin-right:6px}
.seg{display:inline-flex;padding:3px;border-radius:10px;background:var(--sf2);border:1px solid var(--line)}
.seg label{position:relative}.seg input{position:absolute;opacity:0}
.seg span{display:block;padding:7px 14px;border-radius:8px;font-weight:600;font-size:14px;color:var(--mute);cursor:pointer}
.seg input:checked+span{background:var(--sf);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg input:focus-visible+span{outline:2px solid var(--acc)}
.ai-opts{display:grid;gap:12px;margin-top:12px}
.ck{display:inline-flex;gap:6px;align-items:center;font-size:14px;cursor:pointer}
h1,h2,h3{font-family:var(--f-b);letter-spacing:-.025em}
h1{font-weight:700}
.card,.post,.fw,.bandc,.ccard{border-radius:var(--r)}
.empty{border:0;background:var(--sf2);border-radius:var(--r)}
header.top{background:color-mix(in srgb,var(--sf) 82%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(12px);backdrop-filter:saturate(1.6) blur(12px)}
.bt b{font-family:var(--f-d)}
.btn{border-radius:10px;transition:filter .15s,transform .1s}.btn:active{transform:translateY(1px)}
/* sinf kartochkasi: doira bezaklari o'rniga ingichka rangli chiziq */
.ccard{box-shadow:inset 0 3px 0 var(--c)}
.ccard .ct{background:transparent;min-height:96px}
.ccard .ct::after{display:none}
.ccard .cb{border-top:1px solid var(--line);background:var(--sf)}
.ccard:hover{border-color:var(--line);box-shadow:inset 0 3px 0 var(--c),var(--shadow)}
/* sinf banneri: "Aa" belgisisiz, tekis rang */
.banner{border:0;border-radius:18px;background:color-mix(in srgb,var(--c) 10%,var(--sf))}
.banner::after{display:none}
.codebox{border-color:transparent;box-shadow:0 1px 2px rgba(20,24,38,.06)}
.tabs a,.tabs button{border-bottom-width:2px}
.filters button.on{background:var(--acc);border-color:var(--acc);color:var(--aci)}

/* kirish sahifasi: katta animatsiyali ZEMSTARK */
.auth-hero{gap:28px;justify-content:space-between}
.auth-hero::after{display:none}
.zbox{flex:1;display:flex;align-items:center}
.auth-hero .zw{display:flex;align-items:flex-end;font:800 clamp(54px,7.9vw,124px)/.9 var(--f-d);letter-spacing:-.045em;max-width:none;margin:0}
.zw span{display:inline-block;color:var(--ink);background:linear-gradient(100deg,var(--ink) 36%,var(--acc) 50%,var(--ink) 64%) 100% 0/280% 100% no-repeat;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  animation:zrise .8s cubic-bezier(.2,.8,.2,1) calc(var(--i)*70ms) both,zshine 7s ease-in-out calc(1.4s + var(--i)*90ms) infinite}
.zdot{display:inline-block;width:.17em;height:.17em;margin:0 0 .09em .06em;border-radius:.035em;background:var(--hl);animation:zpop .5s cubic-bezier(.3,1.6,.5,1) .85s both}
@keyframes zrise{from{opacity:0;transform:translateY(.32em);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes zshine{0%,55%{background-position:100% 0}85%,100%{background-position:0 0}}
@keyframes zpop{from{transform:scale(0) rotate(-45deg)}to{transform:none}}
.feat{grid-template-columns:1fr 1fr;gap:18px 24px;max-width:600px;padding-top:24px;border-top:1px solid var(--line)}
.feat b{font-size:14px}.feat span{font-size:13px;line-height:1.45;display:block}
.auth-side{background:var(--bg)}
.auth-card{border:0;box-shadow:var(--shadow)}
@media(max-width:880px){.auth-hero{padding-block:76px 36px}.zbox{justify-content:center}.auth-hero .zw{font-size:clamp(46px,15vw,96px)}}

<script>
'use strict';
/* ================= yordamchilar ================= */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl=s=>esc(s).replace(/\n/g,'<br>');
const linkify=s=>nl(s).replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]])/g,'<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>');
const paras=s=>String(s||'').split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean).map(p=>`<p>${nl(p)}</p>`).join('');
const words=s=>(String(s||'').match(/\S+/g)||[]).length;
const initials=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'?';
const first=n=>String(n||'').trim().split(/\s+/)[0];
const pad=n=>String(n).padStart(2,'0');
const OY=['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentabr','oktabr','noyabr','dekabr'];
const fDate=t=>{const d=new Date(t);return `${d.getDate()}-${OY[d.getMonth()]}`+(d.getFullYear()!==new Date().getFullYear()?` ${d.getFullYear()}`:'')};
const fTime=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
const fDT=t=>fDate(t)+', '+fTime(t);
const fDur=ms=>{const s=Math.max(0,Math.round(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':'+pad(m):m)+':'+pad(x)};
const fNum=x=>x==null?'—':(Math.round(x*100)/100).toString();
const fBand=x=>x==null?'—':Number(x).toFixed(1);
const toLocal=t=>{if(!t)return'';const d=new Date(t);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`};
const clone=o=>JSON.parse(JSON.stringify(o));
const rid=()=>[...crypto.getRandomValues(new Uint8Array(5))].map(b=>b.toString(16).padStart(2,'0')).join('');

async function api(m,u,b){
  const r=await fetch('/api'+u,{method:m,headers:b!==undefined?{'Content-Type':'application/json'}:{},body:b!==undefined?JSON.stringify(b):undefined,credentials:'same-origin'});
  let j={};try{j=await r.json()}catch(e){}
  if(r.status===401&&ME&&!/^\/(me|login|google)/.test(u)){ME=null;renderAuth();throw new Error('Sessiya tugadi. Qaytadan kiring')}
  if(!r.ok)throw new Error(j.error||('Server xatosi ('+r.status+')'));
  return j;
}
async function upload(file,name){
  if(file.size>60*1024*1024)throw new Error('Fayl hajmi 60 MB dan oshmasin');
  const r=await fetch('/api/upload?name='+encodeURIComponent(name||file.name||'fayl'),{method:'POST',headers:{'Content-Type':file.type||'application/octet-stream'},body:file,credentials:'same-origin'});
  let j={};try{j=await r.json()}catch(e){}
  if(!r.ok)throw new Error(j.error||'Faylni yuklab bo‘lmadi');
  return {fid:j.fid,name:j.name,type:j.type};
}

async function route(){
  if(!ME)return renderAuth();
  const h=location.hash;
  if(TAKE&&TAKE.running&&h!==H('w',TAKE.wid,'take')){vio('nav','Imtihon sahifasidan chiqishga urinildi');setHash(H('w',TAKE.wid,'take'));return}
  if(ED&&ED.dirty&&h!==ED.hash){const target=h;setHash(ED.hash);if(!await confirmBox('Saqlanmagan o‘zgarishlar bor','Sahifadan chiqsangiz, kiritgan o‘zgarishlaringiz yo‘qoladi.','Chiqish',true))return;edUnstash();ED=null;setHash(target)}
  if(TAKE&&!TAKE.running)cleanupTake();
  if(ME.mustChange&&h!=='#me'){setHash('#me');}
  const r=parts(),seq=++navSeq;
  if(!(r[0]==='new'||(r[0]==='w'&&r[2]==='edit')))ED=null;
  if(r[0]!=='s')GR=null;
  if(!(r[0]==='w'&&r[2]==='take'))VP=null;
  $('#app').innerHTML=header()+'<main><div class="loading"><div class="spin"></div></div></main>';
  try{
    let v;
    if(!r.length)v=await pageHome();
    else if(r[0]==='me')v=await pageProfile();
    else if(r[0]==='c')v=await pageClass(r[1],r[2]||'stream',r[3]);
    else if(r[0]==='new')v=await pageEditor({cid:r[1],kind:r[2]});
    else if(r[0]==='w'&&r[2]==='edit')v=await pageEditor({wid:r[1]});
    else if(r[0]==='w'&&r[2]==='take')v=await pageTake(r[1],r[3]==='all');
    else if(r[0]==='w')v=await pageWork(r[1]);
    else if(r[0]==='s')v=await pageSub(r[1]);
    else{location.hash='';return}
    if(seq!==navSeq||!v)return;
    if(v.bare)$('#app').innerHTML=v.html;
    else $('#app').innerHTML=header()+`<main class="${v.cls||''}">${v.html}</main>`;
    window.scrollTo(0,0);
    if(v.after)v.after();
  }catch(e){
    if(seq!==navSeq)return;
    $('#app').innerHTML=header()+`<main><div class="empty">${ic('alert')}<h3>Sahifani ochib bo‘lmadi</h3><p>${esc(e.message)}</p><a class="btn ghost" href="#">${ic('home')} Bosh sahifaga</a></div></main>`;
  }
}

async function doAuth(){

  try{
    ME=r?await api('POST','/register',{name:$('#an').value,email:$('#ae').value,password:$('#ap').value,role:($('input[name=role]:checked')||{}).value,teacherCode:($('#ac')||{}).value,lang:LNG()}):await api('POST','/login',{email:$('#ae').value,password:$('#ap').value,lang:LNG()});

async function pageClass(cid,tab,extra){
  const c=await api('GET','/classes/'+cid);
  const own=c.isOwner;
  const tabs=[['stream','E’lonlar','mega'],['work','Vazifalar','clip'],['people','A’zolar','users']].concat(own?[['grades','Baholar','chart'],['settings','Sozlamalar','gear']]:[['progress','Natijalarim','chart']]);
  if(own&&tab==='progress'&&extra){}else if(!tabs.some(t=>t[0]===tab))tab='stream';
  let body='',after=null;
  if(tab==='stream')body=await tabStream(c);
  else if(tab==='work'){body=await tabWork(c);after=()=>renderWorkList()}
  else if(tab==='people')body=tabPeople(c);
  else if(tab==='grades')body=await tabGrades(c);
  else if(tab==='progress')body=await tabProgress(c,own?extra:null);
  else if(tab==='settings')body=await tabSettings(c);
  const active=tab==='progress'&&own?'people':tab;
  return {html:`<div class="banner" style="--c:var(--sk-${c.color})"><div>${c.level?`<span class="eyebrow">${esc(c.level)}</span>`:''}<h1>${esc(c.name)}</h1><p>${c.sec?esc(c.sec)+' · ':''}${own?`${c.students} o‘quvchi`:'O‘qituvchi: '+esc(c.teacher.name)}</p></div>
   ${own?`<div class="codebox"><div><small>Sinf kodi</small><b>${esc(c.code)}</b></div><button class="btn ghost sm" data-a="copy" data-v="${esc(c.code)}">${ic('copy')} Nusxa</button></div>`:''}</div>
   <nav class="tabs" aria-label="Sinf bo‘limlari">${tabs.map(([k,l,i])=>`<a href="${H('c',cid,k)}" class="${k===active?'on':''}" ${k===active?'aria-current="page"':''}>${ic(i)}<span>${l}</span></a>`).join('')}</nav>${body}`,after};
}

  const feed=[...posts.map(p=>({t:p.at,p})),...works.filter(w=>!w.draft&&!w.scheduled).map(w=>({t:w.published,w}))].sort((a,b)=>b.t-a.t);
  const now=Date.now();
  const up=works.filter(w=>!w.draft&&!w.scheduled&&w.kind!=='material'&&w.kind!=='vocab'&&w.dueAt&&w.dueAt>now&&(c.isOwner||(w.my&&(w.my.status==='none'||w.my.status==='started')))).sort((a,b)=>a.dueAt-b.dueAt).slice(0,5);

   :`<a class="fw" href="${H('w',x.w.id)}"><span class="wico k-${x.w.kind}">${ic(KI[x.w.kind])}</span><span class="fm"><b><span class="notr">${esc(c.teacher.name)}</span> yangi ${KD[x.w.kind].toLowerCase()} joyladi: <span class="notr">${esc(x.w.title)}</span></b><small>${fDT(x.t)}</small></span>${ic('right')}</a>`;
  return `<div class="stream"><aside>
   <div class="card side-card"><h2>${ic('cal')} Yaqin muddatlar</h2>${up.length?`<div class="tlist">${up.map(w=>`<a href="${H('w',w.id)}" style="--c:var(--sk-${w.skill})"><span class="dot8"></span><span class="tm"><b>${esc(w.title)}</b><small>${fDT(w.dueAt)}</small></span></a>`).join('')}</div>`:'<p class="mute sm">Yaqin kunlarda muddati tugaydigan vazifa yo‘q.</p>'}<p style="margin-top:12px"><a href="${H('c',c.id,'work')}" class="sm">Barcha vazifalar →</a></p></div>
   ${c.isOwner?`<div class="card side-card"><h2>${ic('users')} O‘quvchilarni taklif qilish</h2><p class="mute sm">O‘quvchilar ro‘yxatdan o‘tib, “Sinfga qo‘shilish” tugmasi orqali shu kodni kiritadi.</p><div class="codebox" style="margin-top:12px"><div><small>Sinf kodi</small><b>${esc(c.code)}</b></div><button class="btn ghost sm" data-a="copy" data-v="${esc(c.code)}">${ic('copy')}</button></div></div>`:''}
  </aside><section>
   ${c.isOwner?`<div class="card composer"><label class="lbl" for="postText">Sinfga e’lon</label><textarea id="postText" placeholder="Masalan: Ertangi darsga Unit 4 lug‘atini takrorlab keling."></textarea><div id="postFiles" class="flist"></div><div class="row wrap"><button class="btn ghost sm" data-a="postFile">${ic('upload')} Fayl biriktirish</button><span class="sp"></span><button class="btn" data-a="postSend">E’lon qilish</button></div></div>`:''}
   ${feed.length?feed.map(item).join(''):`<div class="empty">${ic('mega')}<h3>Hali e’lon yo‘q</h3><p>${c.isOwner?'E’lonlar va yangi vazifalar shu yerda ko‘rinadi.':'O‘qituvchi e’lon yoki vazifa joylaganda shu yerda ko‘rasiz.'}</p></div>`}

async function tabWork(c){
  PG.works=await api('GET',`/classes/${c.id}/works`);PG.cls=c;

}
function renderWorkList(){
  const c=PG.cls,all=PG.works,f=PG.filter;
  const fl=[['all','Hammasi'],['ielts','IELTS'],['grammar','Grammar'],['vocabulary','Vocabulary'],['reading','Reading'],['listening','Listening'],['writing','Writing'],['speaking','Speaking'],['vocab','Lug‘at'],['material','Materiallar']].concat(c.isOwner?[['draft','Qoralamalar']]:[]);
  const avail=fl.filter(([k])=>k==='all'||all.some(w=>match(w,k)));
  $('#wfilters').innerHTML=avail.length>1?avail.map(([k,l])=>`<button class="${f===k?'on':''}" data-a="wf" data-v="${k}" aria-pressed="${f===k}">${l}</button>`).join(''):'';
  const ws=all.filter(w=>match(w,f));
  if(!all.length){$('#wlist').innerHTML=`<div class="empty">${ic('clip')}<h3>Hali vazifa yo‘q</h3><p>${c.isOwner?'Uy vazifasi, test, IELTS mashqi yoki material yarating. Google Classroom’dagi eski vazifalarni “Sozlamalar” bo‘limidan ko‘chirishingiz mumkin.':'O‘qituvchi vazifa joylaganda shu yerda ko‘rinadi.'}</p>${c.isOwner?`<button class="btn" data-a="createMenu">${ic('plus')} Birinchi vazifani yaratish</button>`:''}</div>`;return}
  if(!ws.length){$('#wlist').innerHTML=`<div class="empty sm">${ic('list')}<p>Bu filtr bo‘yicha vazifa topilmadi.</p></div>`;return}
  const groups=new Map();for(const w of ws){const k=w.topic||'';if(!groups.has(k))groups.set(k,[]);groups.get(k).push(w)}
  const keys=[...groups.keys()].sort((a,b)=>(a===''?-1:b===''?1:0));
  $('#wlist').innerHTML=keys.map(k=>`<section class="topic">${k?`<h2>${esc(k)}<small>${groups.get(k).length} ta</small></h2>`:''}${groups.get(k).map(w=>workRow(w,c)).join('')}</section>`).join('');
}
function match(w,f){return f==='all'?true:f==='vocab'?w.kind==='vocab':f==='ielts'?w.kind==='ielts':f==='material'?w.kind==='material':f==='draft'?w.draft:w.skill===f}
function workRow(w,c){
  const now=Date.now(),od=w.dueAt&&now>w.dueAt;
  let side='';
  if(w.kind==='material')side='';
  else if(w.kind==='vocab'){if(c.isOwner){const s=w.stats;side=w.draft?'':`<span class="num"><b>${s.active}</b>/${s.students} mashq qilmoqda</span><span class="chip ok">${s.learnedAvg}% o‘rganilgan</span>`}else{const m=w.my;side=m.due?`<span class="chip amb">${m.due} ta takrorlash</span>`:`<span class="chip ok">${m.learned}/${m.total} o‘rganildi</span>`}}
  else if(c.isOwner){const s=w.stats;side=w.draft?'':`<span class="num"><b>${s.submitted}</b>/${s.students} topshirdi</span>${s.toGrade?`<span class="chip amb">${s.toGrade} tekshirilmagan</span>`:''}`}
  else side=myStatus(w,od);
  return `<a class="wrow" href="${H('w',w.id)}"><span class="wico k-${w.kind}">${ic(KI[w.kind])}</span><span class="wmain"><b>${esc(w.title)}</b><span class="meta">
   ${w.kind==='ielts'?'<span class="chip band">IELTS</span>':`<span class="chip">${KD[w.kind]}</span>`}${w.skill!=='mixed'?skChip(w.skill):''}
   ${w.dueAt?`<span class="sep ${od&&!c.isOwner&&w.my&&w.my.status!=='graded'&&w.my.status!=='submitted'?'od':''}">${ic('cal')}${fDT(w.dueAt)}</span>`:''}
   ${w.timeLimit?`<span class="sep">${ic('clock')}${w.timeLimit} daq</span>`:''}${w.kind==='vocab'?`<span class="sep">${ic('cards')}${w.cards} ta so‘z</span>`:''}${w.proctor?`<span class="chip acc">${ic('shield')}Autoproctor</span>`:''}${w.draft?'<span class="chip warn">Qoralama</span>':''}${w.scheduled?`<span class="chip acc">${ic('clock')}${fDT(w.publishAt)} da joylanadi</span>`:''}
  </span></span><span class="wside">${side}</span></a>`;
}
function myStatus(w,od){const m=w.my||{};
  if(m.status==='graded')return m.band!=null?`<span class="chip band">Band ${fBand(m.band)}</span>`:`<span class="chip ok num">${fNum(m.score)}/${fNum(m.max)}</span>`;
  if(m.status==='submitted')return `<span class="chip acc">Topshirildi</span>${m.late?'<span class="chip warn">Kechikkan</span>':''}`;
  if(m.status==='started')return `<span class="chip amb">Boshlangan</span>`;
  return od?`<span class="chip warn">Muddati o‘tgan</span>`:`<span class="chip">Topshirilmagan</span>`;
}

async function tabGrades(c){

   <div class="bars" aria-label="${SK[k]} band tarixi">${s.history.map(b=>`<i style="height:${Math.max(4,b/9*100)}%" title="Band ${fBand(b)}"></i>`).join('')}</div></div>`};
  const hist=[...p.ielts.map(x=>({...x,res:`<span class="chip band">Band ${fBand(x.band)}</span>`})),...p.other.map(x=>({...x,res:`<span class="chip ok num">${fNum(x.score)}/${fNum(x.max)}</span>`}))].sort((a,b)=>b.at-a.at);
  return `${uid?`<div class="crumbs"><a href="${H('c',c.id,'people')}">${ic('left')} A’zolar</a></div>`:''}

  return q}

function edCount(){return ED.questions.reduce((a,q)=>a+units(q)+(q.type==='writing'||q.type==='speaking'?1:0),0)}
function edTotal(){const ielts=ED.kind==='ielts';if(ielts)return 'Band';const g=ED.questions.filter(q=>q.type!=='section'&&!(q.type==='html'&&!htmlPts(q)));if(!g.length)return ED.pts||100;return g.reduce((a,q)=>a+(q.type==='html'?htmlPts(q):q.type==='gap'||q.type==='match'?units(q):Number(q.pts)||0),0)}
function edMeta(){const c=$('#edCnt'),t=$('#edTot');if(c)c.textContent=edCount();if(t)t.textContent=edTotal();ED.questions.forEach((q,i)=>{if(q.type==='gap'){const h=$('#gh-'+i);if(h)h.innerHTML=gapHint(q)}})}
function setPath(o,p,v){const k=p.split('.').map(x=>x==='q'?'questions':x);let t=o;for(let i=0;i<k.length-1;i++){const key=/^\d+$/.test(k[i])?+k[i]:k[i];if(t[key]==null)t[key]=/^\d+$/.test(k[i+1])?[]:{};t=t[key]}const l=k[k.length-1];t[/^\d+$/.test(l)?+l:l]=v}
function edSet(el){
  const p=el.dataset.b;let v;
  if(el.type==='checkbox')v=el.checked;else if(el.type==='radio'){if(!el.checked)return;v=el.value}else if(el.type==='number')v=el.value===''?'':Number(el.value);else v=el.value;
  if(el.dataset.t==='lines')v=el.value.split('\n');else if(el.dataset.t==='pipes')v=el.value.split('|');
  setPath(ED,p,v);ED.dirty=true;edStash();
  if(p==='kind'){if(v==='ielts'&&!IEL.includes(ED.skill))ED.skill='reading';if(v==='quiz'&&!ED.timeLimit)ED.timeLimit=20;if(v==='vocab')ED.skill='vocabulary'}
  if(p==='publish'){const b=$('#edPubBtn');if(b)b.textContent=pubLabel()}
  if(el.dataset.r)edRender();else edMeta();
}
async function edSave(mode){

function edTpl(){
  const s=ED.skill,Q=[];const sec=t=>Object.assign(newQ('section'),{text:t});
  if(s==='reading'){ED.timeLimit=60;Q.push(sec('Passage 1 · Questions 1–13'),sec('Passage 2 · Questions 14–26'),sec('Passage 3 · Questions 27–40'))}
  if(s==='listening'){ED.timeLimit=30;ED.audioOnce=true;Q.push(sec('Part 1 · Questions 1–10'),sec('Part 2 · Questions 11–20'),sec('Part 3 · Questions 21–30'),sec('Part 4 · Questions 31–40'))}
  if(s==='writing'){ED.timeLimit=60;Q.push(Object.assign(newQ('writing'),{task:'task1',minWords:150}),Object.assign(newQ('writing'),{task:'task2',minWords:250}))}
  if(s==='speaking'){Q.push(sec('Part 1 · Introduction and interview'),Object.assign(newQ('speaking'),{part:'1',maxSec:60}),sec('Part 2 · Long turn'),Object.assign(newQ('speaking'),{part:'2',prepSec:60,maxSec:120}),sec('Part 3 · Discussion'),Object.assign(newQ('speaking'),{part:'3',maxSec:90}))}
  ED.questions.push(...Q);ED.dirty=true;edRender();toast('Tuzilma qo‘shildi. Endi matn va savollarni to‘ldiring');
}
